[package]
name = "ov-gateway-rs"
version = "0.0.1"
edition = "2021"
publish = false
description = "Experimental Rust port of the OpenViking Gateway hot path (Anthropic Messages streaming), for performance comparison only"
license = "AGPL-3.0"

# Standalone: not a member of the repository workspace.
[workspace]

[dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
once_cell = "1"
bytes = "1"
futures-util = "0.3"
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }
memchr = "2"
parking_lot = "0.12"
mimalloc = { version = "0.1", default-features = false }
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = 1
