replicaCount: 1
nameOverride: ""
fullnameOverride: ""
image:
  repository: ghcr.io/volcengine/openviking
  # Required until appVersion names a published release containing these features.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Optional management-key and redis-password entries; root-key is required for
# enabled local/KMS encryption. See the operations guide for generating it.
existingSecret: ""
config:
  openviking_url: http://openviking:1933
  workers: 1
  keep_alive_seconds: 75
  capture_concurrency: 1
  management_api: true
  openviking_keys: false
  tenancy: account
  request_log_sink: store
  session_ttl_days: 7
  response_ttl_seconds: 604800
  storage:
    kernel: sqlite
    management: sqlite
    key_prefix: "ovgw:"
    redis:
      mode: standalone
      endpoints: ["redis://redis:6379"]
      password_env: OPENVIKING_GATEWAY_REDIS_PASSWORD
      pool_size: 64
  encryption:
    enabled: false
    provider: local
  default_upstreams: {}

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi

service:
  type: ClusterIP
  port: 80
  annotations: {}
  loadBalancerSourceRanges: []
networkPolicy:
  enabled: false
  # Kubernetes NetworkPolicyPeer entries, e.g. podSelector or ipBlock.
  # Empty denies incoming traffic when the policy is enabled.
  ingressFrom: []

terminationGracePeriodSeconds: 660
resources:
  requests:
    cpu: "2"
    memory: 4Gi
  limits:
    cpu: "2"
    memory: 4Gi
startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 2
  failureThreshold: 150
  timeoutSeconds: 2
livenessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 30
  timeoutSeconds: 5
readinessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  timeoutSeconds: 5

# Inject other credentials through secretKeyRef and refer to them as $VAR in config.
extraEnv: []
extraVolumes: []
extraVolumeMounts: []
podLabels: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
